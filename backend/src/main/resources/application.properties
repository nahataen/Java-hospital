server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/hospitalizaciones?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# La BD legacy mezcla snake_case y camelCase (apellidoP, ViaAdministracion):
# usar nombres verbatim en vez del snake_case automático de Spring.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
